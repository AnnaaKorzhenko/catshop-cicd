name: ci-test-lab-02

on: 
  push:
    branches:
      - lab-02

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: lab-02

      - run: python -m pytest tests -q
        working-directory: lab-02

  build:
    needs: test           # a broken commit is not worth a docker build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - run: docker build --label org.opencontainers.image.revision=${{ github.sha }} -t catshop:${{ github.sha }} lab-02

      - name: the image starts, and the app inside it imports
        run: |
          docker run --rm -d --name shop -p 8080:8080 catshop:${{ github.sha }}
          for i in $(seq 1 20); do curl -fsS localhost:8080/health && break; sleep 1; done
          curl -fsS localhost:8080/health
          docker rm -f shop

  publish:
    needs: [build, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: lab-02
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - run: echo "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"